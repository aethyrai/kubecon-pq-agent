apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aethyr-policy
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/aethyrai/kubecon-pq-agent.git
    targetRevision: main
    path: deploy/platform/aethyr
  destination:
    server: https://kubernetes.default.svc
  # The live demo edits the CryptoPolicy spec with kubectl. Argo creates the resource but never
  # diffs or re-applies its spec, so a sync triggered by an unrelated merge cannot undo the rotation.
  ignoreDifferences:
    - group: aethyr.io
      kind: CryptoPolicy
      jsonPointers: [/spec]
  syncPolicy:
    automated: { prune: false, selfHeal: false }
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
