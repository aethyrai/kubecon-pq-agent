apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aethyr-policy
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/aethyrai/kubecon-pq-agent.git
    targetRevision: main
    path: deploy/platform/aethyr
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    # No selfHeal: the live demo edits the CryptoPolicy with kubectl and Argo must not revert it.
    automated: { prune: false, selfHeal: false }
    syncOptions: [ServerSideApply=true]
