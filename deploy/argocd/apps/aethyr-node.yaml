apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aethyr-node
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/aethyrai/kubecon-pq-agent.git
    targetRevision: main
    path: deploy/charts/aethyr-node
    helm:
      valueFiles: [../../env/hack/aethyr-node.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: aethyr-system
  # The operator stamps spec.template.metadata.annotations["aethyr.io/config-hash"] to hot-reload the
  # gateway; Argo must neither diff nor revert it.
  ignoreDifferences:
    - group: apps
      kind: DaemonSet
      name: aethyr-node
      namespace: aethyr-system
      jqPathExpressions:
        - '.spec.template.metadata.annotations["aethyr.io/config-hash"]'
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
