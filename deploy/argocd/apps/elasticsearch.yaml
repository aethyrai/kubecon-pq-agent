apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elasticsearch
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/aethyrai/kubecon-pq-agent.git
    targetRevision: main
    path: deploy/charts/elasticsearch
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true]
