apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radar
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://skyhook-io.github.io/helm-charts
      chart: radar
      targetRevision: 1.20.2
      helm:
        releaseName: radar
        valueFiles:
          - $values/deploy/env/hack/radar.yaml
    - repoURL: https://github.com/aethyrai/kubecon-pq-agent.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/aethyrai/kubecon-pq-agent.git
      targetRevision: main
      path: deploy/platform/radar
  destination:
    server: https://kubernetes.default.svc
    namespace: radar
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true]
