image:
  repository: ghcr.io/aethyrai/kubecon-pq-agent/web
  tag: latest
  pullPolicy: IfNotPresent
replicas: 2
host: app.kube.aethyr.cloud
apiUrl: http://api.conf.svc
identityUrl: http://identity.aethyr-system.svc
dash0:
  endpoint: ""
  tokenSecret: dash0-rum
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }
# Dash0 deployment markers: PostSync and SyncFail hook Jobs post one dash0.deployment event.
deployEvent:
  image: curlimages/curl:8.11.1
  endpoint: http://otel-collector.observability.svc:4318
