apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: elastic
  labels: { app: elasticsearch }
spec:
  type: ClusterIP
  selector: { app: elasticsearch }
  ports:
    - { name: http, port: 9200, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: elastic
  labels: { app: elasticsearch }
spec:
  clusterIP: None
  selector: { app: elasticsearch }
  ports:
    - { name: transport, port: 9300, targetPort: transport }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch
  namespace: elastic
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: elasticsearch }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: elastic
  labels: { app: elasticsearch }
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
          ports:
            - { name: http, containerPort: 9200 }
            - { name: transport, containerPort: 9300 }
          env:
            - { name: discovery.type, value: single-node }
            - { name: cluster.name, value: kubecon }
            - { name: node.name, value: es-0 }
            - { name: ES_JAVA_OPTS, value: "-Xms4g -Xmx4g" }
            - { name: xpack.security.enabled, value: "true" }
            - { name: xpack.security.http.ssl.enabled, value: "false" }
            - { name: xpack.security.transport.ssl.enabled, value: "false" }
            - { name: xpack.ml.enabled, value: "false" }
            - { name: ingest.geoip.downloader.enabled, value: "false" }
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef: { name: elasticsearch-credentials, key: password }
          resources:
            requests: { cpu: "1", memory: 5Gi }
            limits: { cpu: "3", memory: 6Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - 'curl -sf -u "elastic:${ELASTIC_PASSWORD}" "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null'
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 20Gi }
