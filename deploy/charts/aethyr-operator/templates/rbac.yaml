apiVersion: v1
kind: ServiceAccount
metadata:
  name: aethyr-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aethyr-operator
rules:
  - apiGroups: [aethyr.io]
    resources: [cryptopolicies, pqtunnels, pqpeers]
    verbs: [get, list, watch]
  - apiGroups: [aethyr.io]
    resources: [cryptopolicies/status, pqtunnels/status, pqpeers/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aethyr-operator
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aethyr-operator }
subjects:
  - { kind: ServiceAccount, name: aethyr-operator, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aethyr-operator
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update, patch]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aethyr-operator
  namespace: {{ .Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aethyr-operator }
subjects:
  - { kind: ServiceAccount, name: aethyr-operator, namespace: {{ .Release.Namespace }} }
