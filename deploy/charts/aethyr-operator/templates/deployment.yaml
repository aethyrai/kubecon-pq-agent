apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethyr-operator
  namespace: {{ .Release.Namespace }}
  labels: { app: aethyr-operator, app.kubernetes.io/part-of: kubecon-pq-agent }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: aethyr-operator }
  template:
    metadata:
      labels: { app: aethyr-operator }
    spec:
      serviceAccountName: aethyr-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: AETHYR_SYSTEM_NAMESPACE, value: {{ .Release.Namespace }} }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            exec: { command: ["sh", "-c", "kill -0 1"] }
            periodSeconds: 20
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
