image:
  repository: ghcr.io/aethyrai/kubecon-pq-agent/api
  tag: latest
  pullPolicy: IfNotPresent
replicas: 2
port: 8080
canary:
  steps: [20, 50, 100]
  pauseSeconds: 30
hpa:
  enabled: false
  min: 2
  max: 6
  cpuPercent: 70
pdb:
  minAvailable: 1
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }
env: []
secretEnv: []
otel:
  endpoint: http://otel-collector.observability.svc:4317
