apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-{{ .Values.image.tag | replace "." "-" | trunc 20 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels: { app: ingest }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels: { app: ingest }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ingest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: INGEST_SOURCE, value: {{ .Values.source | quote }} }
            - { name: FIXTURE_DIR, value: /app/fixtures/sched }
            - { name: EMBEDDER, value: local }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: HF_HUB_CACHE, value: /app/.model-cache }
            - name: ELASTICSEARCH_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.elasticsearch.secretName }}, key: url } }
            - name: ELASTICSEARCH_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.elasticsearch.secretName }}, key: api-key } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
