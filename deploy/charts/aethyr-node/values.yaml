image:
  repository: ghcr.io/aethyrai/aethyr-tunnel
  tag: dev
  pullPolicy: IfNotPresent
imagePullSecret: ghcr-pull
# One responder container per PQTunnel; the operator renders tunnel-<name>.json into the ConfigMap.
tunnels:
  - { name: api, port: 7443 }
  - { name: mcp-server, port: 7444 }
  - { name: identity, port: 7445 }
configMap: aethyr-gateway-config
tlsSecret: aethyr-gateway-tls
seedSecret: aethyr-gateway-seed
clientSecret: aethyr-client-tls
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
bootstrap:
  image: alpine/openssl:3.5.1
  caDays: 30
  serverSans: "DNS:api.kube.aethyr.cloud,DNS:gateway.aethyr-system.svc,IP:34.22.42.147"
