apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: identity
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [aethyr.io]
    resources: [pqpeers]
    verbs: [get, create, patch]
  - apiGroups: [aethyr.io]
    resources: [pqpeers/status]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
    resourceNames: [aethyr-peer-tokens, aethyr-trail]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
# CryptoPolicy is cluster-scoped: identity records every rotation in its signed trail.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: identity-cryptopolicy-reader
rules:
  - apiGroups: [aethyr.io]
    resources: [cryptopolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: identity-cryptopolicy-reader
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: identity-cryptopolicy-reader }
subjects:
  - { kind: ServiceAccount, name: identity, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: identity
  namespace: {{ .Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: identity }
subjects:
  - { kind: ServiceAccount, name: identity, namespace: {{ .Release.Namespace }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: {{ .Release.Namespace }}
  labels: { app: identity, app.kubernetes.io/part-of: kubecon-pq-agent }
spec:
  replicas: 1
  # One writer at a time: a rolling update would let old and new identity both append to the
  # signed trail Secret for a few seconds and fork the chain.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: identity }
  template:
    metadata:
      labels: { app: identity }
    spec:
      serviceAccountName: identity
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: identity
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8082 }]
          env:
            - { name: PEER_NAMESPACE, value: {{ .Release.Namespace }} }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: identity }
  ports: [{ name: http, port: 80, targetPort: http }]
