# identity: /register only through the tunnel gateway (same namespace), /verify only from api in conf.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: identity-ingress, namespace: aethyr-system }
spec:
  podSelector:
    matchLabels: { app: identity }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: aethyr-node } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: conf } }
          podSelector: { matchLabels: { app: api } }
      ports: [{ protocol: TCP, port: 8082 }]
