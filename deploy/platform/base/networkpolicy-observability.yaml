# observability: the OTel collector accepts OTLP from every namespace and nothing else.
# Egress stays open: the collector exports to Dash0 over the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: observability }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-otlp-from-cluster, namespace: observability }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: {} }]
      ports: [{ protocol: TCP, port: 4317 }, { protocol: TCP, port: 4318 }]
