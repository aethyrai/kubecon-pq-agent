mode: daemonset
fullnameOverride: otel-agent
image:
  repository: otel/opentelemetry-collector-k8s
presets:
  kubeletMetrics: { enabled: true }
  hostMetrics: { enabled: true }
  logsCollection: { enabled: true, includeCollectorLogs: false }
  kubernetesAttributes: { enabled: true }
extraEnvs:
  - name: DASH0_AUTH_TOKEN
    valueFrom:
      secretKeyRef: { name: dash0-auth, key: token }
  - name: DASH0_ENDPOINT
    valueFrom:
      secretKeyRef: { name: dash0-auth, key: endpoint }
  - name: DASH0_DATASET
    value: default
config:
  receivers:
    otlp: null
    jaeger: null
    zipkin: null
    prometheus: null
  connectors:
    count:
      logs:
        aethyr.tunnel.handshakes:
          description: AWP tunnel handshakes completed, by negotiated algorithms
          conditions:
            - 'IsMatch(body, "AWP handshake completed")'
          attributes:
            - { key: kem }
            - { key: sig }
            - { key: side }
        aethyr.tunnel.sessions.established:
          description: AWP tunnel sessions established on the gateway
          conditions:
            - 'IsMatch(body, "tunnel session established")'
  processors:
    transform/aethyr:
      error_mode: ignore
      log_statements:
        - context: log
          conditions:
            - 'resource.attributes["k8s.namespace.name"] == "aethyr-system"'
          statements:
            - 'set(attributes["kem"], ExtractPatterns(body, "kem_alg=\\\"(?P<v>[^\\\"]+)\\\"")["v"]) where IsMatch(body, "kem_alg=")'
            - 'set(attributes["sig"], ExtractPatterns(body, "sig_alg=\\\"(?P<v>[^\\\"]+)\\\"")["v"]) where IsMatch(body, "sig_alg=")'
            - 'set(attributes["side"], ExtractPatterns(body, "side=\\\"(?P<v>[^\\\"]+)\\\"")["v"]) where IsMatch(body, "side=")'
            - 'set(attributes["peer_did"], ExtractPatterns(body, "peer_did=\\\"?(?P<v>did:[^ \\\"]+)")["v"]) where IsMatch(body, "peer_did=")'
    batch: { timeout: 5s }
    memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
    resource/cluster:
      attributes:
        - { key: k8s.cluster.name, value: kube-aethyr, action: upsert }
        - { key: deployment.environment.name, value: hackathon, action: upsert }
  exporters:
    otlp/dash0:
      endpoint: ${env:DASH0_ENDPOINT}
      headers:
        authorization: Bearer ${env:DASH0_AUTH_TOKEN}
        dash0-dataset: ${env:DASH0_DATASET}
  service:
    pipelines:
      traces: null
      metrics:
        receivers: [kubeletstats, hostmetrics]
        processors: [memory_limiter, k8sattributes, resource/cluster, batch]
        exporters: [otlp/dash0]
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, resource/cluster, transform/aethyr, batch]
        exporters: [otlp/dash0, count]
      metrics/aethyr:
        receivers: [count]
        processors: [resource/cluster, batch]
        exporters: [otlp/dash0]
ports:
  otlp: { enabled: false }
  otlp-http: { enabled: false }
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 300m, memory: 384Mi }
