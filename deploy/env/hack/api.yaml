image:
  tag: sha-ff350ab
hpa:
  enabled: true
  min: 2
  max: 6
secretEnv:
  - { name: ELASTICSEARCH_URL, secret: elasticsearch-api-key, key: url }
  - { name: ELASTICSEARCH_API_KEY, secret: elasticsearch-api-key, key: api-key }
  - { name: CHAOS_TOKEN, secret: chaos-token, key: token }
env:
  - { name: DEMO_MODE, value: "true" }
  - { name: MODEL_OFFLINE, value: "1" }
  - { name: MODEL_CACHE_DIR, value: /app/.model-cache }
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 1Gi }
